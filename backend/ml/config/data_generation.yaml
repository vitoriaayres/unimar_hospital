# Configuração do Gerador de Dados Sintéticos - PharmaPredict
# Baseado em literatura de farmácia hospitalar brasileira (ANVISA, SUS, estudos acadêmicos)

simulation:
  start_date: "2021-01-01"
  end_date: "2026-09-25"
  random_seed: 42

hospital:
  name: "Hospital Municipal São José"
  beds: 350
  departments:
    - id: "icu"
      name: "UTI Geral"
      weight: 0.15
      consumption_multiplier: 2.2  # Aumentado: UTI consome mais
      specialty: "critical_care"
      # UTI tem maior variação (surtos afetam mais)
      variability_factor: 1.5
    - id: "er"
      name: "Pronto Socorro"
      weight: 0.25
      consumption_multiplier: 1.4  # Aumentado: PS é mais movimentado
      specialty: "emergency"
      # PS tem picos em feriados/fim de semana
      weekend_multiplier: 1.3
      holiday_multiplier: 1.4
    - id: "ward"
      name: "Enfermarias Clínicas"
      weight: 0.45
      consumption_multiplier: 1.0
      specialty: "general"
      # Enfermaria mais estável
      variability_factor: 0.8
    - id: "outpatient"
      name: "Ambulatório"
      weight: 0.15
      consumption_multiplier: 0.5  # Reduzido: ambulatório consome menos
      specialty: "outpatient"
      # Ambulatório: menos no inverno (menos consultas eletivas)
      winter_multiplier: 0.7
      summer_multiplier: 1.2

products:
  count: 500
  atc_distribution:
    "J01": 0.20   # Antibióticos para uso sistêmico
    "N02": 0.15   # Analgésicos
    "B01": 0.10   # Antitrombóticos
    "C07": 0.08   # Bloqueadores beta
    "A02": 0.08   # Inibidores de bomba de prótons
    "R03": 0.07   # Broncodilatadores
    "N05": 0.06   # Psicolépticos
    "C09": 0.05   # Inibidores da ECA
    "H02": 0.04   # Corticosteroides
    "OTHER": 0.17 # Demais classes

  class_base_demand_per_100_beds:
    "J01": 45   # Alta demanda - antibióticos
    "N02": 60   # Muito alta - analgésicos
    "B01": 25   # Moderada - anticoagulantes
    "C07": 30   # Moderada - betabloqueadores
    "A02": 35   # Moderada-alta - PPIs
    "R03": 20   # Moderada - broncodilatadores
    "N05": 15   # Baixa - psicotrópicos
    "C09": 28   # Moderada - IECA
    "H02": 12   # Baixa - corticoides
    "OTHER": 22 # Média

  unit_cost_ranges:
    "J01": [5, 150]      # Antibióticos
    "N02": [1, 80]       # Analgésicos
    "B01": [10, 300]     # Anticoagulantes
    "C07": [2, 50]       # Betabloqueadores
    "A02": [3, 60]       # PPIs
    "R03": [8, 120]      # Broncodilatadores
    "N05": [5, 200]      # Psicotrópicos
    "C09": [4, 80]       # IECA
    "H02": [3, 90]       # Corticoides
    "OTHER": [2, 100]    # Outros

  controlled_substance_probability: 0.08
  min_stock_multiplier: 0.15
  max_stock_multiplier: 2.5
  lead_time_days:
    mean: 7
    std: 3
    min: 1
    max: 30

seasonality:
  enabled: true
  fourier_terms: 3
  amplitude: 0.25

  holidays_br:
    - name: "Carnaval"
      dates:
        - "2021-02-15"
        - "2021-02-16"
        - "2022-02-28"
        - "2022-03-01"
        - "2023-02-20"
        - "2023-02-21"
        - "2024-02-12"
        - "2024-02-13"
        - "2025-03-03"
        - "2025-03-04"
        - "2026-02-17"
        - "2026-02-18"
      effect: 0.35
      window_days: 7

    - name: "Semana_Santa"
      dates:
        - "2021-04-02"
        - "2022-04-15"
        - "2023-04-07"
        - "2024-03-29"
        - "2025-04-18"
        - "2026-04-03"
      effect: 0.25
      window_days: 4

    - name: "Tiradentes"
      dates:
        - "2021-04-21"
        - "2022-04-21"
        - "2023-04-21"
        - "2024-04-21"
        - "2025-04-21"
        - "2026-04-21"
      effect: 0.15
      window_days: 3

    - name: "Dia_do_Trabalho"
      dates:
        - "2021-05-01"
        - "2022-05-01"
        - "2023-05-01"
        - "2024-05-01"
        - "2025-05-01"
        - "2026-05-01"
      effect: 0.15
      window_days: 3

    - name: "Corpus_Christi"
      dates:
        - "2021-06-03"
        - "2022-06-16"
        - "2023-06-08"
        - "2024-05-30"
        - "2025-06-19"
        - "2026-06-04"
      effect: 0.20
      window_days: 3

    - name: "Independencia"
      dates:
        - "2021-09-07"
        - "2022-09-07"
        - "2023-09-07"
        - "2024-09-07"
        - "2025-09-07"
        - "2026-09-07"
      effect: 0.15
      window_days: 3

    - name: "Nossa_Senhora_Aparecida"
      dates:
        - "2021-10-12"
        - "2022-10-12"
        - "2023-10-12"
        - "2024-10-12"
        - "2025-10-12"
        - "2026-10-12"
      effect: 0.20
      window_days: 3

    - name: "Finados"
      dates:
        - "2021-11-02"
        - "2022-11-02"
        - "2023-11-02"
        - "2024-11-02"
        - "2025-11-02"
        - "2026-11-02"
      effect: 0.15
      window_days: 3

    - name: "Proclamacao_Republica"
      dates:
        - "2021-11-15"
        - "2022-11-15"
        - "2023-11-15"
        - "2024-11-15"
        - "2025-11-15"
        - "2026-11-15"
      effect: 0.15
      window_days: 3

    - name: "Natal"
      dates:
        - "2021-12-25"
        - "2022-12-25"
        - "2023-12-25"
        - "2024-12-25"
        - "2025-12-25"
        - "2026-12-25"
      effect: 0.30
      window_days: 7

    - name: "Ano_Novo"
      dates:
        - "2021-01-01"
        - "2022-01-01"
        - "2023-01-01"
        - "2024-01-01"
        - "2025-01-01"
        - "2026-01-01"
        - "2027-01-01"
      effect: 0.25
      window_days: 5

  # Padrões sazonais específicos por classe ATC (reforçados para realismo)
  class_seasonality:
    "J01": # Antibióticos - muito mais no inverno (infecções respiratórias)
      winter_multiplier: 1.6
      summer_multiplier: 0.7
      # Pico adicional em maio-agosto (inverno Brasil)
      may_multiplier: 1.3
      june_multiplier: 1.5
      july_multiplier: 1.6
      august_multiplier: 1.4
    "R03": # Broncodilatadores - muito mais no inverno/seca
      winter_multiplier: 1.8
      summer_multiplier: 0.6
      may_multiplier: 1.4
      june_multiplier: 1.7
      july_multiplier: 1.8
      august_multiplier: 1.5
    "N02": # Analgésicos - mais em feriados/fim de ano
      winter_multiplier: 1.15
      summer_multiplier: 0.9
      november_multiplier: 1.25
      december_multiplier: 1.4
      january_multiplier: 1.2
    "A02": # PPIs - mais no final de ano (estresse/dieta)
      november_multiplier: 1.3
      december_multiplier: 1.5
      january_multiplier: 1.25
    "B01": # Antitrombóticos - mais no inverno (menor mobilidade)
      winter_multiplier: 1.3
      summer_multiplier: 0.85
    "C07": # Betabloqueadores - estável com leve aumento no verão
      winter_multiplier: 0.95
      summer_multiplier: 1.1
    "N05": # Psicolépticos - mais em períodos de estresse
      winter_multiplier: 1.2
      december_multiplier: 1.3
      january_multiplier: 1.15
    "H02": # Corticosteroides - mais no inverno (inflamações)
      winter_multiplier: 1.4
      summer_multiplier: 0.8

suppliers:
  count: 12
  tiers:
    - name: "distribuidor_nacional"
      count: 4
      lead_time_days: {mean: 5, std: 2, min: 2, max: 10}
      reliability: 0.95
      fill_rate: 0.92
      min_order_value: 5000

    - name: "distribuidor_regional"
      count: 5
      lead_time_days: {mean: 3, std: 1, min: 1, max: 7}
      reliability: 0.92
      fill_rate: 0.88
      min_order_value: 2000

    - name: "fabricante_direto"
      count: 3
      lead_time_days: {mean: 14, std: 5, min: 7, max: 30}
      reliability: 0.88
      fill_rate: 0.95
      min_order_value: 10000

inventory_policy:
  review_period_days: 7
  service_level: 0.95
  safety_stock_method: "demand_variability"  # ou "fixed_days"
  safety_stock_days: 14
  fefo_enabled: true
  expiry_alert_days: 90
  auto_reorder: true
  max_order_frequency_days: 3

consumption_noise:
  distribution: "negative_binomial"  # Dados de contagem superdispersos
  dispersion: 3.0  # Aumentado para reduzir variância extrema
  zero_inflation: 0.03  # Reduzido para menos zeros
  min_consumption: 0
  # Pareto distribution for demand heterogeneity (80/20 rule)
  # Higher alpha = less extreme distribution
  # Alpha=2.0 gives moderate heterogeneity (~60/40 split)
  pareto_alpha: 2.0

stockout_cascade:
  enabled: true
  hawkes_baseline: 0.002
  hawkes_alpha: 0.35
  hawkes_beta: 0.15
  emergency_order_multiplier: 2.5
  emergency_lead_time_reduction: 0.5
  stockout_cost_multiplier: 5.0

prescription_patterns:
  routine: 0.70
  emergency: 0.20
  prophylactic: 0.10

output:
  format: "parquet"
  partition_by: "month"
  compression: "snappy"
  include_metadata: true