services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmapredict-postgres
    environment:
      POSTGRES_DB: pharmapredict
      POSTGRES_USER: pharmapredict
      POSTGRES_PASSWORD: pharmapredict_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmapredict -d pharmapredict"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pharmapredict-network

  redis:
    image: redis:7-alpine
    container_name: pharmapredict-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pharmapredict-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    container_name: pharmapredict-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --artifacts-destination /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5001:5000"
    networks:
      - pharmapredict-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmapredict-backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: pharmapredict
      POSTGRES_PASSWORD: pharmapredict_dev
      POSTGRES_DB: pharmapredict
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pharmapredict-network

networks:
  pharmapredict-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mlflow_data: