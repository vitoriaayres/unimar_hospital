name: unimar_hospital

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmapredict-postgres
    environment:
      POSTGRES_DB: pharmapredict
      POSTGRES_USER: pharmapredict
      POSTGRES_PASSWORD: pharmapredict_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmapredict -d pharmapredict"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmapredict-backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: pharmapredict
      POSTGRES_PASSWORD: pharmapredict_dev
      POSTGRES_DB: pharmapredict
    volumes:
      # Modelo treinado e previsões geradas pelo pipeline em backend/ml
      - ./backend/ml/models:/app/ml/models:ro
      - ./backend/ml/data:/app/ml/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: pharmapredict-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    profiles: ["full"]

volumes:
  postgres_data:
