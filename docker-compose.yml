version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmapredict-postgres
    environment:
      POSTGRES_DB: pharmapredict
      POSTGRES_USER: pharmapredict
      POSTGRES_PASSWORD: pharmapredict_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmapredict -d pharmapredict"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pharmapredict-network

  redis:
    image: redis:7-alpine
    container_name: pharmapredict-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pharmapredict-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    container_name: pharmapredict-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --artifacts-destination /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5001:5000"
    depends_on:
      - minio
    networks:
      - pharmapredict-network

  minio:
    image: alpine/minio:latest-release
    container_name: pharmapredict-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - pharmapredict-network

  create-buckets:
    image: minio/mc:latest
    container_name: pharmapredict-create-buckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/mlflow-artifacts --ignore-existing;
      mc mb local/pharmapredict-backups --ignore-existing;
      mc mb local/pharmapredict-reports --ignore-existing;
      echo 'Buckets created successfully';
      "
    networks:
      - pharmapredict-network

networks:
  pharmapredict-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mlflow_data: